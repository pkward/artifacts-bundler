apiVersion: v1
kind: Service
metadata:
  name: artifacts-nginx-nodeport
spec:
  type: NodePort
  selector:
    app: artifacts-nginx
  ports:
    - name: http
      port: 80           # Cluster‐internal port
      targetPort: 80     # Container port
      nodePort: 30080    # External port on each node (must be 30000–32767)
      protocol: TCP
