apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ssl-config
data:
  default.conf: |
    server {
      listen 443 ssl;
      server_name _;
      ssl_certificate     /etc/nginx/tls/server.crt;
      ssl_certificate_key /etc/nginx/tls/server.key;
      root /usr/share/nginx/html;
      location /downloads/ {
        autoindex on;
        etag on;
        try_files $uri $uri/ =404;
      }
    }
